<style>
/* ───────────────────────── tokens ───────────────────────── */
:root {
  --font: "Inter var", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --r-sm: 6px; --r: 10px; --r-lg: 16px; --r-xl: 22px;

  --ease-spring: cubic-bezier(.34, 1.4, .64, 1);

  --bg: #0a0c11; --bg-glow: #8b7cf622;
  --surface: #11141b; --surface-2: #171b24; --surface-3: #1e2330;
  --border: #232937; --border-strong: #2f3647;

  --sev-critical: #ff4d6d; --sev-high: #ff8a3d; --sev-medium: #f2c14e; --sev-low: #4cc2f0; --sev-info: #8c94a8;

  --tk-kw: #c4a7ff; --tk-str: #8fe3b0; --tk-num: #ffb86b; --tk-com: #5c657a; --tk-fn: #7cc7ff;
  --shadow: 0 1px 0 #ffffff08 inset, 0 10px 30px -12px #00000080;
}
:root[data-theme="light"] {
  --bg: #f6f7fb; --bg-glow: #8b7cf618;
  --surface: #ffffff; --surface-2: #f3f4f8; --surface-3: #e9ebf2;
  --border: #e3e6ee; --border-strong: #d2d6e2;
  --text: #11131a; --text-2: #3e4456; --muted: #6a7186;
  --primary: #6d5ae6; --primary-2: #5a46d6; --on-primary: #ffffff;
  --focus: #6d5ae6;
  --code-bg: #fafbfd; --code-hl: #e0294d12; --code-hl-bar: #e0294d;
  --add-bg: #1a9a6414; --add-fg: #127a4e; --del-bg: #e0294d10; --del-fg: #b8163a;
  --sev-critical: #e0294d; --sev-high: #e36a12; --sev-medium: #b98a00; --sev-low: #0f88c2; --sev-info: #6a7186;
  --ok: #109b6a;

}

/* ───────────────────────── base ───────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font: 15px/1.55 var(--font); color: var(--text); background: var(--bg);
  font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body::before { /* soft glow tinted by verdict */
  content: ""; position: fixed; inset: -20vh -10vw auto; height: 70vh; pointer-events: none; z-index: 0;
  background: radial-gradient(60% 60% at 30% 0%, var(--bg-glow), transparent 70%);
}
.wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 0 24px 64px; }
a { color: var(--primary-2); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: .86em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ───────────────────────── top bar ───────────────────────── */
.top {
  position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(1.4) blur(14px);
  background: color-mix(in oklab, var(--bg) 78%, transparent); border-bottom: 1px solid var(--border);
}
.top .wrap { display: flex; align-items: center; gap: 14px; height: 58px; padding-bottom: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
.brand .logo { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 4px 10px color-mix(in oklab, var(--primary) 40%, transparent)); }
.brand-accent { color: var(--primary-2); }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--primary), color-mix(in oklab, var(--primary) 55%, #ff4d6d)); color: #fff; box-shadow: 0 4px 14px -4px var(--primary); }
.brand-mark svg { width: 16px; height: 16px; }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-2); font-size: 14px; }
.crumb .sep { color: var(--border-strong); }
.crumb .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13.5px; font-weight: 550;
  transition: background .15s, border-color .15s, transform .15s var(--ease);
}
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn:active { transform: scale(.97); }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.btn.primary:hover { background: var(--primary-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn[aria-pressed="true"] { border-color: var(--primary); color: var(--primary-2); background: color-mix(in oklab, var(--primary) 10%, var(--surface)); }
.chip-ref { font: 12px var(--mono); color: var(--text-2); padding: 4px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); }
.menu { position: relative; }
.menu-pop {
  position: absolute; inset-inline-end: 0; top: calc(100% + 8px); min-width: 250px; padding: 6px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: 0 20px 50px -20px #0009; display: none;
  transform-origin: top right; animation: pop .18s var(--ease);
}
.menu.open .menu-pop { display: block; }
.menu-pop button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: start; padding: 9px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.menu-pop button:hover, .menu-pop button:focus-visible { background: var(--surface-2); }
.menu-pop small { display: block; color: var(--muted); font-size: 12px; }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }

/* ───────────────────────── hero ───────────────────────── */
.hero {
  display: grid; grid-template-columns: auto 1fr minmax(300px, 380px); gap: 32px; align-items: center;
  margin-top: 28px; padding: 28px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
}
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-3); }
.ring .bar { stroke: var(--grade); stroke-linecap: round; filter: drop-shadow(0 0 10px color-mix(in oklab, var(--grade) 45%, transparent)); transition: stroke-dashoffset 1.4s var(--ease); }
.ring .inner { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.grade { font-size: 52px; font-weight: 750; line-height: 1; letter-spacing: -.04em; color: var(--grade); }
.score { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.verdict {
  display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px 5px 9px; border-radius: 999px; font-size: 13px; font-weight: 600;
  color: var(--vc); background: color-mix(in oklab, var(--vc) 13%, transparent); border: 1px solid color-mix(in oklab, var(--vc) 30%, transparent);
}
.verdict .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--vc); box-shadow: 0 0 0 0 var(--vc); animation: ping 2.2s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--vc) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.hero h1 { margin: 12px 0 8px; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.2; letter-spacing: -.02em; font-weight: 680; }
.hero .summary { margin: 0; color: var(--text-2); max-width: 64ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.facts b { color: var(--text); font-weight: 600; }
.sev-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.sev-tile {
  position: relative; padding: 12px 10px 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border);
  cursor: pointer; text-align: start; transition: transform .2s var(--ease), border-color .2s, background .2s;
}
.sev-tile:hover { transform: translateY(-2px); border-color: color-mix(in oklab, var(--sc) 50%, var(--border)); }
.sev-tile[aria-pressed="true"] { border-color: var(--sc); background: color-mix(in oklab, var(--sc) 10%, var(--surface-2)); }
.sev-tile .n { display: block; font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--sc); }
.sev-tile .n.zero { color: var(--muted); opacity: .6; }
.sev-tile .l { display: block; font-size: 11.5px; color: var(--muted); text-transform: capitalize; margin-top: 2px; }
.stack { display: flex; height: 8px; border-radius: 99px; overflow: hidden; margin-top: 14px; background: var(--surface-3); gap: 2px; }
.stack span { background: var(--sc); transform-origin: left; animation: grow .9s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.legend-cap { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

/* ───────────────────────── insights ───────────────────────── */
.insights { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); }
.panel h2 { margin: 0 0 12px; font-size: 13px; font-weight: 650; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.bars { display: grid; gap: 4px; }
.bar-row {
  display: grid; grid-template-columns: minmax(120px, 190px) 1fr 32px; gap: 12px; align-items: center; padding: 6px 8px; margin: 0 -8px;
  border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: start; font-size: 13.5px;
}
.bar-row:hover { background: var(--surface-2); }
.bar-row[aria-pressed="true"] { background: color-mix(in oklab, var(--primary) 12%, transparent); }
.bar-row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .track { height: 6px; border-radius: 9px; background: var(--surface-3); overflow: hidden; }
.bar-row .fill { display: block; height: 100%; border-radius: 9px; background: var(--primary); transform-origin: left; animation: grow .9s var(--ease) both; }
.bar-row .c { text-align: end; color: var(--text-2); font-variant-numeric: tabular-nums; }
.file-row .lbl { font: 12.5px var(--mono); direction: rtl; text-align: left; }
.file-row .lbl bdi { direction: ltr; }
.pips { display: flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border-radius: 3px; background: var(--sc); }

/* ───────────────────────── workspace ───────────────────────── */
.section-head { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 12px; }
.section-head h2 { margin: 0; font-size: 20px; letter-spacing: -.015em; }
.section-head .count { color: var(--muted); font-size: 14px; }
.work { display: grid; grid-template-columns: minmax(330px, 410px) 1fr; gap: 16px; align-items: start; }
.list-pane { position: sticky; top: 74px; max-height: calc(100vh - 90px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.toolbar { padding: 12px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
.search { position: relative; }
.search svg { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input {
  width: 100%; height: 38px; padding: 0 38px 0 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px;
  transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 25%, transparent); }
.search kbd { position: absolute; inset-inline-end: 9px; top: 50%; transform: translateY(-50%); }
kbd { font: 11px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; color: var(--muted); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; font-size: 12.5px; font-weight: 550;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; transition: all .15s var(--ease);
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); }
.chip[aria-pressed="true"] { color: var(--text); border-color: color-mix(in oklab, var(--sc, var(--primary)) 60%, transparent); background: color-mix(in oklab, var(--sc, var(--primary)) 14%, var(--surface-2)); }
.chip .x { opacity: .6; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 550; color: var(--muted); cursor: pointer; transition: all .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0003; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.active-filters:empty { display: none; }

.list { list-style: none; margin: 0; padding: 6px; overflow: auto; flex: 1; scroll-padding: 8px; }
.item {
  position: relative; display: grid; grid-template-columns: 4px 1fr; gap: 12px; padding: 11px 12px 11px 10px; border-radius: 11px; cursor: pointer;
  transition: background .15s; animation: rise .45s var(--ease) both;
}
.item:hover { background: var(--surface-2); }
.item[aria-selected="true"] { background: color-mix(in oklab, var(--sc) 9%, var(--surface-2)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--sc) 35%, transparent); }
.item .rail { border-radius: 4px; background: var(--sc); opacity: .9; }
.item .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
.item .m { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.item .m .mono { font-size: 11.5px; color: var(--text-2); }
.item.dim { opacity: .55; }
.item .tag { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; background: var(--surface-3); color: var(--text-2); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.list-empty { padding: 32px 18px; text-align: center; color: var(--muted); }
.list-empty b { display: block; color: var(--text); margin-bottom: 4px; }
.list-foot { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; gap: 12px; justify-content: space-between; }

/* ───────────────────────── detail ───────────────────────── */
.detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); min-height: 420px; overflow: hidden; }
.detail-inner { padding: 22px 24px 26px; animation: swap .32s var(--ease) both; }
@keyframes swap { from { opacity: 0; transform: translateX(10px); } }
.d-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sev-badge { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border-radius: 7px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--sc); background: color-mix(in oklab, var(--sc) 14%, transparent); }
.sev-badge .d { width: 8px; height: 8px; border-radius: 50%; background: var(--sc); }
.sev-badge.critical .d { animation: ping 1.8s infinite; --vc: var(--sc); }
.d-id { font: 12px var(--mono); color: var(--muted); }
.detail h3 { margin: 12px 0 6px; font-size: 22px; line-height: 1.25; letter-spacing: -.015em; }
.d-loc { display: inline-flex; align-items: center; gap: 6px; font: 13px var(--mono); color: var(--text-2); word-break: break-all; }
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.mchip a { color: inherit; }
.conf { display: inline-flex; gap: 2px; }
.conf i { width: 4px; height: 10px; border-radius: 2px; background: var(--surface-3); }
.conf i.on { background: var(--primary); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.d-section { margin-top: 22px; }
.d-section h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; display: flex; align-items: center; gap: 8px; }
.d-section p { margin: 0; color: var(--text-2); max-width: 78ch; }
.callout { padding: 12px 14px; border-radius: 10px; background: color-mix(in oklab, var(--sev-critical) 7%, var(--surface-2)); border: 1px solid color-mix(in oklab, var(--sev-critical) 20%, var(--border)); }
.callout p { color: var(--text); }
.callout.exploit p { font-size: 14px; }
.callout.exploit code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--border); word-break: break-all; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.code { border-radius: 12px; border: 1px solid var(--border); background: var(--code-bg); overflow: hidden; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--border); font: 12px var(--mono); color: var(--muted); background: var(--surface-2); }
.code-head .btn { height: 28px; font-size: 12px; }
.code pre { margin: 0; padding: 8px 0; overflow: auto; font: 13px/1.65 var(--mono); tab-size: 4; }
.ln { display: grid; grid-template-columns: 52px 1fr; min-width: max-content; }
.ln .no { text-align: end; padding-inline-end: 14px; color: var(--muted); opacity: .6; user-select: none; }
.ln .src { padding-inline-end: 20px; white-space: pre; }
.ln.hl { background: var(--code-hl); box-shadow: inset 3px 0 0 var(--code-hl-bar); animation: flash 1.2s var(--ease); }
.ln.hl .no { color: var(--code-hl-bar); opacity: 1; font-weight: 700; }
@keyframes flash { 0% { background: color-mix(in oklab, var(--code-hl-bar) 30%, transparent); } }
.diff .ln { grid-template-columns: 52px 22px 1fr; }
.diff .sg { user-select: none; text-align: center; }
.diff .ln.del { background: var(--del-bg); } .diff .ln.del .sg, .diff .ln.del .no { color: var(--del-fg); opacity: 1; }
.diff .ln.add { background: var(--add-bg); } .diff .ln.add .sg, .diff .ln.add .no { color: var(--add-fg); opacity: 1; }
.tk-k { color: var(--tk-kw); } .tk-s { color: var(--tk-str); } .tk-n { color: var(--tk-num); } .tk-c { color: var(--tk-com); font-style: italic; } .tk-f { color: var(--tk-fn); }
.refs { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
.refs a { display: inline-flex; gap: 6px; align-items: center; word-break: break-all; }
.triage-note { margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: var(--surface-2); border: 1px dashed var(--border-strong); color: var(--text-2); display: flex; gap: 8px; align-items: center; }
.back { display: none; }
@media (max-width: 700px) { .tray .txt small { display: none; } .actions .spacer { display: none; } }

/* ───────────────────────── cleared & notes ───────────────────────── */
details.cleared { margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
details.cleared > summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; align-items: center; gap: 12px; font-weight: 600; }
details.cleared > summary::-webkit-details-marker { display: none; }
details.cleared > summary .chev { margin-inline-start: auto; transition: transform .25s var(--ease); color: var(--muted); }
details.cleared[open] > summary .chev { transform: rotate(180deg); }
.ok-badge { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in oklab, var(--ok) 15%, transparent); color: var(--ok); }
.cleared-body { padding: 0 20px 18px; display: grid; gap: 14px; }
.reason { border-inline-start: 2px solid var(--border-strong); padding-inline-start: 14px; }
.reason > p { margin: 0 0 6px; color: var(--text); font-size: 14px; }
.reason ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.reason li { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.reason li .mono { color: var(--text-2); }
.notes { margin-top: 16px; }
.notes ul { margin: 0; padding-inline-start: 18px; color: var(--text-2); }

.clean { text-align: center; padding: 56px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); }
.clean .big { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 20px; display: grid; place-items: center; color: var(--ok); background: color-mix(in oklab, var(--ok) 13%, transparent); animation: bob 3s ease-in-out infinite; }
.clean .big svg { width: 36px; height: 36px; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.clean h2 { margin: 0 0 6px; }
.clean p { margin: 0 auto; color: var(--text-2); max-width: 52ch; }

footer { margin-top: 40px; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

.toast {
  position: fixed; bottom: 24px; inset-inline-start: 50%; transform: translate(-50%, 20px); opacity: 0; z-index: 50;
  display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 550;
  background: var(--text); color: var(--bg); box-shadow: 0 16px 40px -12px #000a; transition: all .3s var(--ease-spring); pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

.reveal { animation: rise .6s var(--ease) both; }

/* ───────────────────────── responsive ───────────────────────── */
/* ── clean pass: flatter surfaces, quieter chrome ── */
:root { --shadow: none; }
:root[data-theme="light"] { --shadow: 0 1px 2px #1a1f3008; }
body::before { opacity: .55; }
.hero, .panel, .list-pane, .detail, details.cleared { border-color: var(--border); }
.hero { gap: 28px; padding: 26px 28px; }
.panel h2 { font-size: 12px; letter-spacing: .06em; }
.insights { grid-template-columns: 1fr 1fr; }
.item { padding: 10px 12px 10px 10px; }
.item .t { font-weight: 560; }
.detail-inner { padding: 24px 28px 28px; }
.detail h3 { font-size: 21px; font-weight: 650; }
.d-section { margin-top: 26px; }
.d-section h4 { color: var(--text-2); }

/* trust banner */
.trust {
  margin-top: 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
  padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid color-mix(in oklab, var(--tc) 40%, var(--border));
  background: color-mix(in oklab, var(--tc) 8%, var(--surface)); --tc: var(--sev-medium);
}
.trust.danger { --tc: var(--sev-critical); }
.trust .ti { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--tc); background: color-mix(in oklab, var(--tc) 16%, transparent); }
.trust .ti svg { width: 18px; height: 18px; }
.trust b { display: block; font-size: 14.5px; margin-bottom: 2px; }
.trust p { margin: 0; font-size: 13.5px; color: var(--text-2); max-width: 90ch; }
.trust ul { margin: 8px 0 0; padding-inline-start: 18px; font-size: 13px; color: var(--text-2); }
.trust .tbtn { white-space: nowrap; }

/* detail actions */
.actions { align-items: center; }
.actions .spacer { flex: 1; }
.btn.queued { background: color-mix(in oklab, var(--ok) 14%, var(--surface)); border-color: color-mix(in oklab, var(--ok) 45%, transparent); color: var(--ok); }
.tri { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.tri button { border: 0; background: none; height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; font-weight: 550; color: var(--muted); cursor: pointer; transition: all .15s; }
.tri button:hover { color: var(--text); }
.tri button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0003; }
.fix-note { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.fix-note svg { color: var(--ok); }
.item .q { color: var(--ok); display: inline-flex; align-items: center; gap: 4px; }
.item .q svg { width: 12px; height: 12px; }
.item .q[hidden] { display: none; }
body.has-tray .toast { bottom: 96px; }

/* fix tray */
.tray {
  position: fixed; inset-inline: 0; bottom: 18px; z-index: 30; display: flex; justify-content: center; pointer-events: none;
  transform: translateY(140%); transition: transform .4s var(--ease-spring);
}
.tray.show { transform: none; }
.tray-in {
  pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px; border-radius: 14px; max-width: calc(100vw - 28px);
  background: var(--surface); border: 1px solid var(--border-strong); box-shadow: 0 24px 60px -20px #000b;
}
.tray .cnt { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; color: var(--on-primary); background: var(--primary); font-variant-numeric: tabular-nums; }
.tray .txt b { display: block; font-size: 14px; }
.tray .txt small { display: block; color: var(--muted); font-size: 12px; }
body.has-tray main { padding-bottom: 110px; }

@media (max-width: 1080px) {
  .hero { grid-template-columns: auto 1fr; }
  .hero .sev-wrap { grid-column: 1 / -1; }
}
@media (max-width: 900px) {
  .wrap { padding: 0 14px 48px; }
  .insights { grid-template-columns: 1fr; }
  .work { grid-template-columns: 1fr; }
  .list-pane { position: static; max-height: none; }
  .detail { position: fixed; inset: 0; z-index: 40; border-radius: 0; overflow: auto; transform: translateY(100%); transition: transform .35s var(--ease); border: 0; }
  body.detail-open .detail { transform: none; }
  body.detail-open { overflow: hidden; }
  .back { display: inline-flex; }
  .two { grid-template-columns: 1fr; }
  .crumb .repo, .crumb .sep { display: none; }
  .top-actions .chip-ref { display: none; }
}
@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; padding: 20px; justify-items: start; }
  .ring { width: 120px; height: 120px; }
  .sev-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .sev-tile { padding: 10px 6px 8px; }
  .sev-tile .n { font-size: 20px; }
  .top .export-label { display: none; }
}
.still *, .still *::before, .still *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
@media print {
  .top, .toolbar, .actions, .list-pane, body::before { display: none !important; }
  .work { display: block; } .detail { position: static; transform: none; box-shadow: none; }
}

<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('patchhound-data').textContent);
const SEVS = ['critical', 'high', 'medium', 'low', 'info'];
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n) => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const sevVar = (s) => `--sc:var(--sev-${s})`;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const QS = new URLSearchParams(location.search);
const still = QS.has('still'); // ?still renders the final state with no motion (print, screenshots)
const reduced = still || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) document.documentElement.classList.add('still');

/* ── theme ── */
const root = document.documentElement;
const THEME_KEY = 'patchhound:theme';
function applyTheme(t) {
  root.dataset.theme = t;
  $('#theme-btn').innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
  $('#theme-btn').setAttribute('aria-label', `Switch to ${t === 'dark' ? 'light' : 'dark'} theme`);
}
applyTheme((['dark', 'light'].includes(QS.get('theme')) && QS.get('theme')) || localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('#theme-btn').onclick = () => { const t = root.dataset.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem(THEME_KEY, t); applyTheme(t); };

/* ── triage state (local to this browser) ── */
const TRIAGE_KEY = `patchhound:triage:${D.meta.repo}:${D.meta.ref || D.meta.head || ''}:${D.meta.label}`;
let triage = {};
try { triage = JSON.parse(localStorage.getItem(TRIAGE_KEY) || '{}'); } catch {}
const saveTriage = () => localStorage.setItem(TRIAGE_KEY, JSON.stringify(triage));
const QUEUE_KEY = TRIAGE_KEY.replace(':triage:', ':queue:');
let queue = new Set();
try { queue = new Set(JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]').filter((id) => D.findings.some((f) => f.id === id))); } catch {}
const saveQueue = () => localStorage.setItem(QUEUE_KEY, JSON.stringify([...queue]));
function toggleQueue(id) {
  queue.has(id) ? queue.delete(id) : queue.add(id);
  saveQueue(); tray();
  toast(queue.has(id) ? `${id} queued for fixing` : `${id} removed from queue`);
}
function fixCommand() {
  const ids = D.findings.map((f) => f.id).filter((id) => queue.has(id));
  return `/patchhound:fix ${ids.join(' ')}`;
}
function tray() {
  const n = queue.size;
  $('#tray').classList.toggle('show', n > 0);
  document.body.classList.toggle('has-tray', n > 0);
  $('#tray-n').textContent = n;
  $('#tray-title').textContent = `${n} fix${n === 1 ? '' : 'es'} queued`;
  document.querySelectorAll('#list [data-id]').forEach((li) => { const q = li.querySelector('.q'); if (q) q.hidden = !queue.has(li.dataset.id); });
  const qb = document.querySelector('[data-act="queue"]');
  if (qb) { const on = queue.has(qb.dataset.id); qb.classList.toggle('queued', on); qb.innerHTML = on ? `${icon('check')}Queued for fix` : `${icon('wrench')}Queue fix`; qb.setAttribute('aria-pressed', on); }
}
$('#tray-clear').onclick = () => { queue.clear(); saveQueue(); tray(); toast('Fix queue cleared'); };
$('#tray-copy').onclick = () => copy(fixCommand(), 'Command copied — paste it into Claude Code');

/* ── filter state (in the URL hash so it's shareable) ── */
const state = { sev: new Set(), cat: null, file: null, q: '', status: 'open', sel: null };
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.sev = new Set((p.get('sev') || '').split(',').filter((s) => SEVS.includes(s)));
  state.cat = p.get('cat'); state.file = p.get('file'); state.q = p.get('q') || '';
  state.status = ['open', 'all', 'triaged'].includes(p.get('status')) ? p.get('status') : 'open';
  state.sel = p.get('id');
}
function writeHash() {
  const p = new URLSearchParams();
  if (state.sel) p.set('id', state.sel);
  if (state.sev.size) p.set('sev', [...state.sev].join(','));
  if (state.cat) p.set('cat', state.cat);
  if (state.file) p.set('file', state.file);
  if (state.q) p.set('q', state.q);
  if (state.status !== 'open') p.set('status', state.status);
  history.replaceState(null, '', '#' + p.toString());
}

/* ── hero ── */
const GRADE_COLOR = { A: 'var(--ok)', B: '#7bd88f', C: 'var(--sev-medium)', D: 'var(--sev-high)', F: 'var(--sev-critical)' };
const VERDICT = {
  block: ['Blocks merge', 'var(--sev-critical)', '#ff4d6d26'],
  review: ['Needs attention', 'var(--sev-medium)', '#f2c14e1f'],
  pass: ['Looks clean', 'var(--ok)', '#34d3991f'],
};
const modeWord = { pr: 'Pull request', commit: 'Commit', range: 'Commit range', branch: 'Branch', working: 'Uncommitted changes', repo: 'Repository' }[D.meta.mode] || 'Scan';

function hero() {
  document.title = `PatchHound · ${D.meta.label}`;
  $('#crumb-repo').textContent = D.meta.repo || '';
  $('#crumb-label').textContent = D.meta.label;
  const ref = D.meta.ref || D.meta.head;
  if (ref) { const c = $('#ref-chip'); c.hidden = false; c.textContent = ref.slice(0, 7); c.title = ref; }

  const ring = $('#ring');
  ring.style.setProperty('--grade', GRADE_COLOR[D.grade]);
  ring.setAttribute('aria-label', `Security grade ${D.grade}, score ${D.score} out of 100`);
  const C = 2 * Math.PI * 52;
  const bar = $('#ring-bar');
  bar.style.strokeDasharray = C;
  bar.style.strokeDashoffset = C;
  $('#grade').textContent = D.grade;
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.strokeDashoffset = C * (1 - D.score / 100); }));
  countUp($('#score'), D.score, (n) => `${n} / 100`, 1400);

  const [vt, vc, glow] = VERDICT[D.verdict];
  const v = $('#verdict'); v.style.setProperty('--vc', vc); $('#verdict-text').textContent = vt;
  root.style.setProperty('--bg-glow', glow);

  const titleBits = D.meta.pr?.title ? `${D.meta.pr.title}` : D.meta.commit?.title && D.meta.mode !== 'repo' ? D.meta.commit.title : `${modeWord} security review`;
  $('#hero-title').textContent = titleBits;
  $('#summary').textContent = D.summary || (D.findings.length ? `${D.findings.length} security issue${D.findings.length > 1 ? 's' : ''} confirmed.` : 'No security issues were confirmed in this scope.');

  const facts = [];
  if (D.meta.pr?.url) facts.push(`<a href="${esc(D.meta.pr.url)}" target="_blank" rel="noopener">${icon('ext')} PR #${esc(D.meta.pr.number)}</a>`);
  else if (D.meta.mode !== 'repo') facts.push(`<span>${esc(modeWord)}</span>`);
  if (D.meta.pr?.author) facts.push(`<span>by <b>${esc(D.meta.pr.author)}</b></span>`);
  facts.push(`<span><b class="num">${D.meta.filesScanned.toLocaleString()}</b> files scanned</span>`);
  if (D.meta.mode !== 'repo' && D.meta.linesChanged) facts.push(`<span><b class="num">+${D.meta.linesChanged.toLocaleString()}</b> lines changed</span>`);
  else if (D.meta.linesScanned) facts.push(`<span><b class="num">${D.meta.linesScanned.toLocaleString()}</b> lines</span>`);
  facts.push(`<span><b class="num">${D.meta.candidates}</b> rule hits triaged</span>`);
  facts.push(`<time datetime="${esc(D.meta.generatedAt)}" title="${esc(new Date(D.meta.generatedAt).toLocaleString())}">${esc(relTime(D.meta.generatedAt))}</time>`);
  $('#facts').innerHTML = facts.join('');

  const total = D.findings.length;
  $('#sev-grid').innerHTML = SEVS.map((s) => `
    <button class="sev-tile" style="${sevVar(s)}" data-sev="${s}" aria-pressed="false" title="Filter ${s} (${SEVS.indexOf(s) + 1})">
      <span class="n num ${D.counts[s] ? '' : 'zero'}" data-count="${D.counts[s]}">0</span><span class="l">${s}</span>
    </button>`).join('');
  document.querySelectorAll('.sev-tile .n').forEach((el, i) => (reduced ? countUp(el, +el.dataset.count, String, 0) : setTimeout(() => countUp(el, +el.dataset.count, String, 900), 150 + i * 70)));
  $('#stack').innerHTML = total ? SEVS.filter((s) => D.counts[s]).map((s, i) => `<span style="${sevVar(s)};flex:${D.counts[s]};animation-delay:${0.25 + i * 0.08}s" title="${D.counts[s]} ${s}"></span>`).join('') : '';
  $('#stack-cap').textContent = total ? `${total} finding${total > 1 ? 's' : ''}` : 'No findings';
  $('#sev-grid').onclick = (e) => { const b = e.target.closest('[data-sev]'); if (b) toggleSev(b.dataset.sev); };
  $('#foot-left').textContent = `Generated by PatchHound · ${new Date(D.meta.generatedAt).toLocaleString()}${ref ? ' · ' + ref.slice(0, 12) : ''}`;
}

function countUp(el, to, fmt, dur) {
  if (reduced || !to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function relTime(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  if (s < 60) return rtf.format(-Math.round(s), 'second');
  if (s < 3600) return rtf.format(-Math.round(s / 60), 'minute');
  if (s < 86400) return rtf.format(-Math.round(s / 3600), 'hour');
  return rtf.format(-Math.round(s / 86400), 'day');
}

/* ── trust / prompt-injection banner ── */
function trustBanner() {
  const t = D.meta.trust || { level: 'unknown', reasons: [] };
  const inj = D.meta.injectionHits || 0;
  const injFound = D.findings.filter((f) => f.category === 'prompt-injection').length;
  if (t.level === 'trusted' && !inj) return;
  const danger = t.level === 'untrusted' || injFound > 0;
  const head = injFound
    ? `${injFound} attempt${injFound > 1 ? 's' : ''} to manipulate AI reviewers found in this code`
    : t.level === 'untrusted' ? 'You reviewed untrusted code' : t.level === 'caution' ? 'Public code: review with care' : 'Code origin could not be verified';
  $('#trust-root').innerHTML = `<section class="trust reveal ${danger ? 'danger' : ''}" role="note" aria-label="Untrusted code warning">
    <span class="ti">${icon('alert')}</span>
    <div><b>${esc(head)}</b>
      <p>Code from public repos, forks and other authors can hide <strong>prompt injection</strong>: comments, strings or invisible characters written to trick AI tools into hiding problems or running commands. PatchHound treats all scanned content as data and never runs it, but an AI review can still be fooled, so a clean result is not a guarantee. Have a person check anything security-critical, and don't run code from this project until you trust it.</p>
      <ul id="trust-why" hidden>${t.reasons.map((r) => `<li>${rich(r)}</li>`).join('')}${inj ? `<li>${inj} line${inj > 1 ? 's' : ''} matched prompt-injection or hidden-character rules${injFound ? '' : ' (all reviewed and cleared)'}.</li>` : ''}</ul>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
      ${injFound ? `<button class="btn tbtn" id="trust-show">${icon('eye')}Show them</button>` : ''}
      ${(t.reasons.length || inj) ? `<button class="btn ghost tbtn" id="trust-more" aria-expanded="false">Why?</button>` : ''}
    </div>
  </section>`;
  const more = $('#trust-more');
  if (more) more.onclick = () => { const u = $('#trust-why'); u.hidden = !u.hidden; more.setAttribute('aria-expanded', !u.hidden); more.textContent = u.hidden ? 'Why?' : 'Hide'; };
  const show = $('#trust-show');
  if (show) show.onclick = () => { state.cat = 'prompt-injection'; state.status = 'all'; refresh(true); };
}

/* ── insights ── */
function insights() {
  if (!D.findings.length) { $('#insights').hidden = true; return; }
  const maxC = Math.max(...D.categories.map((c) => c.count));

  $('#file-bars').onclick = (e) => { const b = e.target.closest('[data-file]'); if (b) { state.file = state.file === b.dataset.file ? null : b.dataset.file; refresh(true); } };
}

/* ── workspace ── */
function workspace() {
  const wr = $('#work-root');
  if (!D.findings.length) {
    $('#findings-count').textContent = '';
    wr.innerHTML = `<div class="clean reveal"><div class="big">${icon('shield-check')}</div>
      <h2>No security issues confirmed</h2>

    return;
  }
  wr.innerHTML = `
  <div class="work">
    <section class="list-pane" aria-label="Findings list">
      <div class="toolbar">
        <label class="search"><span class="sr">Search findings</span>${icon('search')}<input id="q" type="search" placeholder="Search title, file, CWE…" autocomplete="off"><kbd>/</kbd></label>
        <div class="row-between">
          <div class="seg" role="group" aria-label="Status">
            <button data-status="open">Open</button><button data-status="all">All</button><button data-status="triaged">Triaged</button>
          </div>
          <div class="chips" id="sev-chips" role="group" aria-label="Severity">${SEVS.filter((s) => D.counts[s]).map((s) => `<button class="chip" style="${sevVar(s)}" data-sev="${s}" aria-pressed="false" title="${cap(s)}"><span class="d"></span>${D.counts[s]}</button>`).join('')}</div>
        </div>
        <div class="active-filters" id="active-filters"></div>
      </div>

      <div class="list-foot"><span id="list-count"></span><span><kbd>j</kbd>/<kbd>k</kbd> to move</span></div>
    </section>
    <article class="detail" id="detail" aria-live="polite"></article>
  </div>`;
  const q = $('#q');

  let qt;
  q.oninput = () => { clearTimeout(qt); qt = setTimeout(() => { state.q = q.value.trim(); refresh(false); }, 80); };
  $('.seg').onclick = (e) => { const b = e.target.closest('[data-status]'); if (b) { state.status = b.dataset.status; refresh(false); } };
  $('#sev-chips').onclick = (e) => { const b = e.target.closest('[data-sev]'); if (b) toggleSev(b.dataset.sev); };
  $('#active-filters').onclick = (e) => {

    else if (k === 'cat') state.cat = null; else if (k === 'file') state.file = null; else if (k === 'q') { state.q = ''; $('#q').value = ''; }
    else state.sev.delete(k);
    refresh(false);
  };
  $('#list').onclick = (e) => { const li = e.target.closest('[data-id]'); if (li) select(li.dataset.id, true); };
}

function clearAll() {
  state.sev.clear(); state.cat = state.file = null; state.q = ''; state.status = 'all';
  if ($('#q')) $('#q').value = '';
  refresh(false);
}

function toggleSev(s) {
  if (!D.findings.length) return;
  state.sev.has(s) ? state.sev.delete(s) : state.sev.add(s);
  refresh(true);
}

function visible() {
  const q = state.q.toLowerCase();
  return D.findings.filter((f) => {
    const t = triage[f.id];
    if (state.status === 'open' && t) return false;
    if (state.status === 'triaged' && !t) return false;
    if (state.sev.size && !state.sev.has(f.severity)) return false;
    if (state.cat && f.category !== state.cat) return false;
    if (state.file && f.file !== state.file) return false;
    if (q && !`${f.id} ${f.title} ${f.file} ${f.cwe} ${f.categoryLabel} ${f.description}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

let firstRender = true;
function refresh(scrollToList) {
  if (!D.findings.length) return;
  document.querySelectorAll('[data-sev]').forEach((b) => b.setAttribute('aria-pressed', state.sev.has(b.dataset.sev)));
  document.querySelectorAll('[data-cat]').forEach((b) => b.setAttribute('aria-pressed', state.cat === b.dataset.cat));
  document.querySelectorAll('[data-file]').forEach((b) => b.setAttribute('aria-pressed', state.file === b.dataset.file));
  document.querySelectorAll('[data-status]').forEach((b) => b.setAttribute('aria-pressed', state.status === b.dataset.status));

  const af = [];
  for (const s of state.sev) af.push(`<button class="chip" aria-pressed="true" style="${sevVar(s)}" data-clear="${s}"><span class="d"></span>${cap(s)}${icon('x')}</button>`);
  if (state.cat) af.push(`<button class="chip" aria-pressed="true" data-clear="cat">${esc(D.categories.find((c) => c.key === state.cat)?.label || state.cat)}${icon('x')}</button>`);
  if (state.file) af.push(`<button class="chip mono" aria-pressed="true" data-clear="file">${esc(state.file.split('/').pop())}${icon('x')}</button>`);
  if (state.q) af.push(`<button class="chip" aria-pressed="true" data-clear="q">“${esc(state.q)}”${icon('x')}</button>`);
  $('#active-filters').innerHTML = af.join('');

  const items = visible();
  const nTriaged = Object.keys(triage).filter((k) => D.findings.some((f) => f.id === k)).length;
  $('#findings-count').textContent = `${D.findings.length} total${nTriaged ? ` · ${nTriaged} triaged by you` : ''}`;
  $('#list-count').textContent = `${items.length} of ${D.findings.length} shown`;
  const list = $('#list');
  if (!items.length) {
    list.innerHTML = `<li class="list-empty"><b>No findings match</b>${state.status === 'open' && nTriaged ? 'Triaged findings are hidden. ' : ''}<br><button class="btn" data-clear="all" style="margin-top:10px">Clear filters</button></li>`;
    list.querySelector('[data-clear]').onclick = clearAll;
  } else {
    list.innerHTML = items.map((f, i) => {
      const t = triage[f.id];
      return `<li class="item ${t ? 'dim' : ''}" role="option" data-id="${esc(f.id)}" aria-selected="false" style="${sevVar(f.severity)};animation-delay:${firstRender ? Math.min(i, 14) * 0.035 : 0}s${firstRender ? '' : ';animation:none'}">
        <span class="rail"></span>
        <div><div class="t">${esc(f.title)}</div>
        <div class="m"><span class="mono">${esc(f.file.split('/').pop())}:${f.line}</span><span>${esc(f.categoryLabel)}</span>${f.cwe ? `<span>${esc(f.cwe)}</span>` : ''}${t ? `<span class="tag">${t === 'fp' ? 'False positive' : 'Accepted'}</span>` : ''}<span class="q" ${queue.has(f.id) ? '' : 'hidden'}>${icon('wrench')}Queued</span></div></div>
      </li>`;
    }).join('');
  }
  firstRender = false;
  if (!state.sel || !items.some((f) => f.id === state.sel)) state.sel = items[0]?.id || null;
  renderDetail();
  writeHash();
  if (scrollToList) $('#findings').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
}

function select(id, fromUser) {
  state.sel = id;
  renderDetail();
  writeHash();
  if (fromUser && matchMedia('(max-width: 900px)').matches) document.body.classList.add('detail-open');
}

/* ── detail ── */

    <div class="meta-chips">

      ${f.owasp ? `<span class="mchip">OWASP ${esc(f.owasp)}</span>` : ''}

      <button class="btn icon" data-act="link" title="Copy link to this finding" aria-label="Copy link">${icon('link')}</button>

    ${t ? `<div class="triage-note">${icon('check')}You marked this as ${t === 'fp' ? 'a false positive' : 'an accepted risk'}. Stored only in this browser.</div>` : ''}

    <div class="d-section"><h4>What's wrong</h4><p>${rich(f.description)}</p></div>
    ${f.snippet ? `<div class="d-section">${codeBlock(f)}</div>` : ''}
    ${(f.impact || f.exploit) ? `<div class="d-section two">
      ${f.impact ? `<div><h4>${icon('target')}Impact</h4><div class="callout"><p>${rich(f.impact)}</p></div></div>` : ''}
      ${f.exploit ? `<div><h4>${icon('bolt')}How it could be exploited</h4><div class="callout exploit"><p>${rich(f.exploit)}</p></div></div>` : ''}
    </div>` : ''}
    <div class="d-section"><h4>${icon('wrench')}How to fix</h4><p>${rich(f.fixText)}</p></div>
    ${f.fix ? `<div class="d-section">${diffBlock(f)}</div>` : ''}

  </div>`;
  det.querySelector('#back').onclick = () => document.body.classList.remove('detail-open');

      saveTriage();
      const keep = state.sel;
      refresh(false);
      if (D.findings.some((x) => x.id === keep) && visible().some((x) => x.id === keep)) select(keep);
      toast(triage[f.id] ? (v === 'fp' ? 'Marked as false positive' : 'Risk accepted') : 'Reopened');
    }
  };
  tray();
}

function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : '#'; }
// Minimal inline formatting: `code` spans, nothing else (content is model-written but escaped first).
function rich(s) { return esc(s).replace(/`([^`]+)`/g, '<code class="mono">$1</code>'); }

const KW = /\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|import|from|export|default|async|await|try|catch|finally|throw|typeof|instanceof|in|of|this|super|null|undefined|true|false|def|lambda|pass|elif|with|as|yield|None|True|False|self|and|or|not|is|func|package|go|defer|chan|map|struct|interface|type|public|private|protected|static|final|void|int|string|bool|fn|let|mut|impl|pub|use|mod|match|unsafe|where|echo|require|include|end|then|fi|SELECT|FROM|WHERE|INSERT|UPDATE|DELETE|INTO|VALUES|AND|OR|FROM|RUN|ENV|USER|COPY|uses|run|with)\b/;
const TOK = /(\/\/.*$|#(?![{\[]).*$|\/\*.*?\*\/|--\s.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d[\d_.]*(?:e[+-]?\d+)?\b|\b0x[\da-f]+\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)/gi;
function hl(line, lang) {
  let out = '', last = 0, m;
  const hashComment = ['python', 'shell', 'ruby', 'yaml', 'gha', 'docker', 'terraform', 'env', 'text', 'config'].includes(lang);
  TOK.lastIndex = 0;
  while ((m = TOK.exec(line))) {
    out += esc(line.slice(last, m.index));
    const [t, com, str, num, fn, word] = m;
    if (com && (com[0] !== '#' || hashComment)) out += `<span class="tk-c">${esc(com)}</span>`;
    else if (com) out += esc(com);
    else if (str) out += `<span class="tk-s">${esc(str)}</span>`;
    else if (num) out += `<span class="tk-n">${esc(num)}</span>`;
    else if (fn) out += KW.test(fn) ? `<span class="tk-k">${esc(fn)}</span>` : `<span class="tk-f">${esc(fn)}</span>`;
    else if (word) out += KW.test(word) && word.match(KW)[0] === word ? `<span class="tk-k">${esc(word)}</span>` : esc(word);
    last = TOK.lastIndex;
    if (m[0] === '') TOK.lastIndex++;
  }
  return out + esc(line.slice(last));
}

function codeBlock(f) {
  const s = f.snippet;
  const rows = s.lines.map((l, i) => {
    const n = s.start + i;
    const on = n >= s.hl[0] && n <= s.hl[1];
    return `<div class="ln ${on ? 'hl' : ''}"><span class="no">${n}</span><span class="src">${hl(l, f.lang) || ' '}</span></div>`;
  }).join('');
  return `<div class="code"><div class="code-head"><span>${esc(f.file)}</span><button class="btn ghost" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(s.lines.join('\n')))})">${icon('copy')}Copy</button></div><pre><code>${rows}</code></pre></div>`;
}
function diffBlock(f) {
  const { start, before, after } = f.fix;
  const rows = [
    ...before.map((l, i) => `<div class="ln del"><span class="no">${start + i}</span><span class="sg">−</span><span class="src">${hl(l, f.lang) || ' '}</span></div>`),
    ...after.map((l, i) => `<div class="ln add"><span class="no">${start + i}</span><span class="sg">+</span><span class="src">${hl(l, f.lang) || ' '}</span></div>`),
  ].join('');
  return `<div class="code diff"><div class="code-head"><span>Suggested change · ${esc(f.file)}</span><span class="muted">−${before.length} +${after.length}</span></div><pre><code>${rows}</code></pre></div>`;
}

function fixPrompt(f) {
  return [
    `Fix this security issue found by PatchHound (${f.id}, ${f.severity}${f.cwe ? ', ' + f.cwe : ''}):`,
    ``,
    `**${f.title}** in \`${f.file}\` lines ${f.line}-${f.endLine}`,
    ``,
    f.description,
    f.impact ? `\nImpact: ${f.impact}` : '',
    ``,
    `Suggested fix: ${f.fixText}`,
    f.fix ? `\nProposed replacement for lines ${f.line}-${f.endLine}:\n\`\`\`\n${f.fix.after.join('\n')}\n\`\`\`` : '',
    ``,
    `Read the surrounding code first and fix the root cause (also check for the same pattern elsewhere). Keep behaviour otherwise unchanged, and add or update a test that proves the issue is fixed if the project has tests.`,
  ].filter((x) => x !== '').join('\n');
}

/* ── notes & cleared ── */
function extras() {
  if (D.notes?.length) $('#notes-root').innerHTML = `<div class="panel notes"><h2>Coverage notes</h2><ul>${D.notes.map((n) => `<li>${rich(n)}</li>`).join('')}</ul></div>`;
  const n = D.dismissed.reduce((s, d) => s + d.items.length, 0);
  if (!n) return;
  $('#cleared-root').innerHTML = `<details class="cleared" ${D.findings.length ? '' : 'open'}>
    <summary><span class="ok-badge">${icon('check')}</span><span>Checked and cleared <span class="muted">· ${n} rule hit${n > 1 ? 's' : ''} reviewed and dismissed</span></span>${icon('down').replace('class="i"', 'class="i chev"')}</summary>
    <div class="cleared-body">${D.dismissed.map((d) => `<div class="reason"><p>${rich(d.reason)}</p><ul>${d.items.map((c) => `<li><span class="mono">${esc(c.file)}:${c.line}</span><span>${esc(c.title)}</span></li>`).join('')}</ul></div>`).join('')}</div>
  </details>`;
}

/* ── export ── */
const menu = $('#export-menu');
$('#export-btn').onclick = (e) => { e.stopPropagation(); const o = menu.classList.toggle('open'); $('#export-btn').setAttribute('aria-expanded', o); if (o) menu.querySelector('[role=menuitem]').focus(); };
document.addEventListener('click', (e) => { if (!menu.contains(e.target)) { menu.classList.remove('open'); $('#export-btn').setAttribute('aria-expanded', 'false'); } });
menu.querySelector('.menu-pop').onclick = (e) => {
  const b = e.target.closest('[data-export]'); if (!b) return;
  menu.classList.remove('open');
  const slug = (D.meta.repo || 'patchhound') + '-' + (D.meta.mode) + (D.meta.pr ? '-' + D.meta.pr.number : '');
  if (b.dataset.export === 'md') copy(markdown(), 'PR comment copied');
  if (b.dataset.export === 'json') download(`${slug}.patchhound.json`, JSON.stringify(D, null, 2), 'application/json');
  if (b.dataset.export === 'sarif') download(`${slug}.sarif`, JSON.stringify(sarif(), null, 2), 'application/sarif+json');
};
function markdown() {
  const ICON = { critical: '`CRITICAL`', high: '`HIGH`', medium: '`MEDIUM`', low: '`LOW`', info: '`INFO`' };
  const open = D.findings.filter((f) => !triage[f.id]);
  const L = [`## PatchHound security review — grade **${D.grade}** (${D.score}/100)`, '', `**${VERDICT[D.verdict][0]}** · ${D.meta.label}`, ''];
  if (D.summary) L.push(D.summary, '');
  if ((D.meta.trust && D.meta.trust.level !== 'trusted') || D.meta.injectionHits) L.push('> [!WARNING]', '> Reviewed code from an untrusted source. AI-assisted reviews can be manipulated by prompt injection; a clean result is not a guarantee.', '');
  L.push(`| ${SEVS.map((s) => cap(s)).join(' | ')} |`, `|${SEVS.map(() => ':---:').join('|')}|`, `| ${SEVS.map((s) => D.counts[s]).join(' | ')} |`, '');
  for (const f of open) {
    L.push(`<details><summary>${ICON[f.severity]} <b>${esc(f.title)}</b> — <code>${esc(f.file)}:${f.line}</code>${f.cwe ? ' · ' + f.cwe : ''}</summary>`, '', f.description, '');
    if (f.impact) L.push(`**Impact:** ${f.impact}`, '');
    L.push(`**Fix:** ${f.fixText}`, '');
    if (f.fix) L.push('```diff', ...f.fix.before.map((l) => '- ' + l), ...f.fix.after.map((l) => '+ ' + l), '```', '');
    L.push('</details>');
  }
  if (!open.length) L.push('_No open security issues._');
  return L.join('\n');
}
function sarif() {
  const LV = { critical: 'error', high: 'error', medium: 'warning', low: 'note', info: 'note' };
  return { version: '2.1.0', $schema: 'https://json.schemastore.org/sarif-2.1.0.json', runs: [{ tool: { driver: { name: 'PatchHound', rules: [] } },
    results: D.findings.filter((f) => triage[f.id] !== 'fp').map((f) => ({ ruleId: `patchhound/${f.category}${f.cwe ? '/' + f.cwe : ''}`, level: LV[f.severity], message: { text: `${f.title}: ${f.description}` },
      locations: [{ physicalLocation: { artifactLocation: { uri: f.file }, region: { startLine: f.line, endLine: f.endLine } } }] })) }] };
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Downloaded ${name}`);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch { toast('Copy failed — select the text manually'); }
    ta.remove();
  }
}
let tt;
function toast(msg) {
  const t = $('#toast'); t.querySelector('span').textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── keyboard ── */
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if (typing) document.activeElement.blur();
    document.body.classList.remove('detail-open'); menu.classList.remove('open');
    return;
  }
  if (typing) return;
  if (e.key === '/' && $('#q')) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if (e.key === 't') $('#theme-btn').click();
  else if (e.key === 'f' && state.sel) toggleQueue(state.sel);
  else if (/^[1-5]$/.test(e.key)) toggleSev(SEVS[+e.key - 1]);
  else if ((e.key === 'j' || e.key === 'k' || e.key === 'ArrowDown' || e.key === 'ArrowUp') && D.findings.length) {
    if (e.key.startsWith('Arrow') && document.activeElement !== $('#list')) return;
    e.preventDefault();
    const items = visible(); if (!items.length) return;
    const i = items.findIndex((f) => f.id === state.sel);
    const n = (e.key === 'j' || e.key === 'ArrowDown') ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
    select(items[n].id);
  }
});
window.addEventListener('hashchange', () => { const before = state.sel; readHash(); if (before !== state.sel) refresh(false); });

/* ── boot ── */
const deepLink = /(^|[#&])id=/.test(location.hash);
readHash();
trustBanner();
hero();
insights();
workspace();
extras();
refresh(false);
tray();
if (deepLink && D.findings.length) requestAnimationFrame(() => $('#findings').scrollIntoView({ block: 'start' }));
})();
</script>
</body>
